    TripStopState:
      type: string
      enum: [upcoming, done, skipped]
      description: |
        Derived from the stop's order status — never stored. A pickup stop is
        `done` once the order reads `picked_up` or later; a dropoff stop is
        `done` once it reads `delivered`. A `failed` order marks both of its
        stops `skipped`: settled, but not completed. The status column is
        last-write-wins, so after a failure we cannot tell whether the pickup
        happened first, and the status log is the place to find out.
    TripStop:
      type: object
      required: [id, orderId, kind, sequence, state]
      properties:
        id:
          type: string
        orderId:
          type: string
        kind:
          $ref: "#/components/schemas/TripStopKind"
        sequence:
          type: integer
        state:
          $ref: "#/components/schemas/TripStopState"
    TripStopWithOrder:
      allOf:
        - $ref: "#/components/schemas/TripStop"
        - type: object
          required: [externalOrderId, customerName, customerPhone, restaurantId, restaurantName, restaurantAddress, deliveryAddress, orderStatus, effectivePickupTime]
          properties:
            externalOrderId:
              type: string
            customerName:
              type: string
            customerPhone:
              type: string
            restaurantId:
              type: string
            restaurantName:
              type: string
            restaurantAddress:
              type: string
              description: |
                The pickup address. Carried on the stop so a rider running a
                trip has somewhere to go without opening each order.
            deliveryAddress:
              type: string
            orderStatus:
              $ref: "#/components/schemas/OrderStatus"
            effectivePickupTime:
              type: string
              format: date-time
    TripListItem:
      type: object
      required:
        - id
        - tripNumber
        - status
        - orderCount
        - stopCount
        - doneStopCount
        - skippedStopCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        tripNumber:
          type: integer
        name:
          type: ["string", "null"]
        riderId:
          type: ["string", "null"]
        riderName:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/TripStatus"
        orderCount:
          type: integer
        stopCount:
          type: integer
        doneStopCount:
          type: integer
          description: Stops whose order reports them completed. Derived, not stored.
        skippedStopCount:
          type: integer
          description: |
            Stops belonging to a failed order. Not outstanding, not completed —
            `stopCount - doneStopCount - skippedStopCount` is what is left to do.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TripDetail:
      allOf:
        - $ref: "#/components/schemas/TripListItem"
        - type: object
          required: [stops, orders]
          properties:
            stops:
              type: array
              items:
                $ref: "#/components/schemas/TripStopWithOrder"
            orders:
              type: array
              items:
                $ref: "#/components/schemas/OrderListItem"
    CreateTripRequest:
      type: object
      required: [orderIds]
      properties:
        name:
          type: ["string", "null"]
        riderId:
          type: ["string", "null"]
        orderIds:
          type: array
          items:
            type: string
          minItems: 1
    UpdateTripRequest:
      type: object
      properties:
        name:
          type: ["string", "null"]
        riderId:
          type: ["string", "null"]
        force:
          type: boolean
          description: |
            Required when reassigning a rider while one or more orders on the trip
            are already in motion (past `driver_assigned`). When omitted or false
            and in-flight orders exist, the API returns 409
            `INFLIGHT_REASSIGN_REQUIRES_CONFIRM` with an `inFlightOrders` detail
            payload so the UI can confirm.
    StopInput:
      type: object
      required: [orderId, kind]
      properties:
        orderId:
          type: string
        kind:
          $ref: "#/components/schemas/TripStopKind"
    ReplaceTripStopsRequest:
      type: object
      required: [stops]
      properties:
        stops:
          type: array
          items:
            $ref: "#/components/schemas/StopInput"
          minItems: 1
