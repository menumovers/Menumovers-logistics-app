openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Bestellenbij logistics platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: inbound
  - name: orders
  - name: riders
  - name: restaurants
  - name: users
  - name: settings
  - name: push
  - name: trips
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      security: []
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out
      responses:
        "204":
          description: Logged out
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /inbound/orders:
    post:
      operationId: ingestOrder
      tags: [inbound]
      security: []
      summary: Receive a new order from the upstream distribution service
      description: |
        Authenticated via the `x-inbound-secret` header, matched against a provisioned
        per-source credential (see `api_credentials`) rather than a single shared secret.
        Idempotent on `externalOrderId`: re-sending the same payload updates the existing
        order record instead of creating a duplicate. If `restaurantNameCode` is absent or
        doesn't match any known restaurant, the order is still accepted — it's filed against
        a placeholder restaurant and held (`holdState: parked`) instead of being rejected.
      parameters:
        - in: header
          name: x-inbound-secret
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboundOrderPayload"
      responses:
        "200":
          description: Order accepted (idempotent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid inbound credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders, scoped to the caller's role
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - in: query
          name: restaurantId
          schema:
            type: string
        - in: query
          name: riderId
          schema:
            type: string
        - in: query
          name: q
          schema:
            type: string
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderListItem"
  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get a single order with its full audit trail and overrides
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orders/{id}/status:
    post:
      operationId: transitionOrderStatus
      tags: [orders]
      summary: Advance the order status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionStatusRequest"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
        "422":
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orders/{id}/assign:
    post:
      operationId: assignOrder
      tags: [orders]
      summary: Assign a rider to an order (atomic)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignOrderRequest"
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
        "409":
          description: Order is no longer pending or already assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orders/{id}/pickup-time:
    post:
      operationId: updatePickupTime
      tags: [orders]
      summary: Update one of the pickup time sources
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePickupTimeRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
  /orders/{id}/items/hide:
    post:
      operationId: hideOrderItem
      tags: [orders]
      summary: Hide an item from the order by its index in the original payload
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HideItemRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
  /orders/{id}/items/add:
    post:
      operationId: addOrderItem
      tags: [orders]
      summary: Add an extra item to the order as a display-layer override
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddItemRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
  /orders/{id}/notification:
    post:
      operationId: setRiderNotification
      tags: [orders]
      summary: Set or clear the pending banner message shown to the assigned rider
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRiderNotificationRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
  /orders/{id}/contact:
    post:
      operationId: updateOrderContact
      tags: [orders]
      summary: Override delivery address or customer contact info
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderContactRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
  /orders/{id}/acknowledge:
    post:
      operationId: acknowledgeOrder
      tags: [orders]
      summary: Restaurant acknowledges an order
      description: |
        Records that the restaurant has seen the order and its pickup time. This is a
        read receipt, not a gate — nothing waits on it, and the delivery team works
        the order before and without it. Restaurant staff may acknowledge orders for
        their own restaurant; admins and coordinators may acknowledge any order.

        When `pickupTime` is supplied (the `choose_time` acceptance mode), it is
        written to `pickupTimeRestaurant` and logged as a pickup-time adjustment,
        exactly as an explicit pickup-time update would be.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcknowledgeOrderRequest"
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
  /orders/{id}/hold:
    post:
      operationId: holdOrder
      tags: [orders]
      summary: Place a deliberate hold on an order
      description: |
        Blocks new assignment. An order already being worked keeps accepting status
        reports, so a hold never freezes a rider mid-delivery. Parked orders are
        resolved via `/orders/{id}/restaurant` rather than held.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HoldOrderRequest"
      responses:
        "200":
          description: Held
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
  /orders/{id}/release:
    post:
      operationId: releaseOrder
      tags: [orders]
      summary: Lift a deliberate hold
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
  /orders/{id}/restaurant:
    post:
      operationId: setOrderRestaurant
      tags: [orders]
      summary: Re-point an order at a restaurant
      description: |
        The resolution path for a parked order: assigning the correct restaurant
        lifts the `parked` hold in the same write. A deliberate hold is left in
        place and must be released separately.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetOrderRestaurantRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
  /riders:
    get:
      operationId: listRiders
      tags: [riders]
      summary: List riders with current workload counts
      responses:
        "200":
          description: Riders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RiderWithWorkload"
    post:
      operationId: createRider
      tags: [riders]
      summary: Create a new rider account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRiderRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiderWithWorkload"
  /riders/{id}:
    patch:
      operationId: updateRider
      tags: [riders]
      summary: Update rider account or availability
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRiderRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiderWithWorkload"
  /riders/me/availability:
    post:
      operationId: setOwnAvailability
      tags: [riders]
      summary: Rider sets their own availability status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAvailabilityRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiderWithWorkload"
  /restaurants:
    get:
      operationId: listRestaurants
      tags: [restaurants]
      responses:
        "200":
          description: Restaurants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Restaurant"
    post:
      operationId: createRestaurant
      tags: [restaurants]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRestaurantRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Restaurant"
  /restaurants/{id}:
    patch:
      operationId: updateRestaurant
      tags: [restaurants]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRestaurantRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Restaurant"
    delete:
      operationId: deleteRestaurant
      tags: [restaurants]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /users/me/locale:
    patch:
      operationId: updateMyLocale
      tags: [users]
      summary: Update the calling user's preferred locale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLocaleRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateLocaleResponse"
  /users:
    get:
      operationId: listUsers
      tags: [users]
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    patch:
      operationId: updateSettings
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
  /settings/flags:
    get:
      operationId: getSettingsFlags
      tags: [settings]
      summary: Public-ish operational flags any authenticated user (rider/coordinator/restaurant/admin) may read
      responses:
        "200":
          description: Flags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsFlags"
  /trips:
    get:
      operationId: listTrips
      tags: [trips]
      summary: List trips
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/TripStatus"
        - in: query
          name: riderId
          schema:
            type: string
      responses:
        "200":
          description: Trip list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TripListItem"
    post:
      operationId: createTrip
      tags: [trips]
      summary: Create a new trip from a set of orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTripRequest"
      responses:
        "201":
          description: Trip created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripDetail"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /trips/{id}:
    get:
      operationId: getTrip
      tags: [trips]
      summary: Get trip detail
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Trip detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateTrip
      tags: [trips]
      summary: Rename or reassign a trip
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTripRequest"
      responses:
        "200":
          description: Trip updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripDetail"
  /trips/{id}/stops:
    put:
      operationId: replaceTripStops
      tags: [trips]
      summary: Replace the ordered stop list of a trip
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceTripStopsRequest"
      responses:
        "200":
          description: Trip updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripDetail"
  /trips/{id}/dissolve:
    post:
      operationId: dissolveTrip
      tags: [trips]
      summary: Dissolve a trip and detach its orders
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Trip dissolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripDetail"
  /push/vapid-public-key:
    get:
      operationId: getVapidPublicKey
      tags: [push]
      security: []
      summary: Returns the VAPID public key for push subscription registration
      responses:
        "200":
          description: VAPID public key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapidPublicKey"
  /push/subscribe:
    post:
      operationId: subscribePush
      tags: [push]
      summary: Register a Web Push subscription for the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionRequest"
      responses:
        "201":
          description: Subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscriptionAck"
  /push/unsubscribe:
    post:
      operationId: unsubscribePush
      tags: [push]
      summary: Remove a Web Push subscription for the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnsubscribePushRequest"
      responses:
        "204":
          description: Unsubscribed
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
        requestId:
          type: string
        details: {}
    UserRole:
      type: string
      enum: [admin, coordinator, rider, restaurant_staff]
    AccountStatus:
      type: string
      enum: [active, suspended]
    OrderStatus:
      type: string
      enum:
        - pending
        - driver_assigned
        - en_route_to_restaurant
        - picked_up
        - en_route_to_customer
        - delivered
        - failed
        - postponed
    TripStatus:
      type: string
      enum: [planned, in_progress, completed, dissolved]
    TripStopKind:
      type: string
      enum: [pickup, dropoff]
    RiderAvailability:
      type: string
      enum: [offline, online, backup]
    PickupTimeSource:
      type: string
      enum: [rider, restaurant, override]
    DeliveryMethod:
      type: string
      enum: [delivery, pickup, happy_hour]
    OrderHoldState:
      type: string
      enum: [parked, on_hold]
    RestaurantAcceptanceMode:
      type: string
      enum: [accept, choose_time]
      description: |
        How this restaurant is asked to acknowledge an order. `accept` is a single
        confirm action; `choose_time` confirms by picking one of three pickup times
        (as proposed, ten minutes earlier, ten minutes later). Acknowledgement never
        gates anything either way.
    AcknowledgeOrderRequest:
      type: object
      properties:
        pickupTime:
          type: ["string", "null"]
          format: date-time
          description: |
            Optional. Supplied when the restaurant confirms by choosing a time other
            than the one proposed; written to `pickupTimeRestaurant` through the same
            path as an explicit pickup-time update. Omit to acknowledge as-is.
    HoldOrderRequest:
      type: object
      properties:
        reason:
          type: ["string", "null"]
    SetOrderRestaurantRequest:
      type: object
      required: [restaurantId]
      properties:
        restaurantId:
          type: string
    DeliveryTimeType:
      type: string
      enum: [asap, later_today, other_day]
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    AuthSession:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/CurrentUser"
    CurrentUser:
      type: object
      required: [id, email, name, role, accountStatus]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        accountStatus:
          $ref: "#/components/schemas/AccountStatus"
        restaurantId:
          type: ["string", "null"]
        riderId:
          type: ["string", "null"]
        preferredLocale:
          type: ["string", "null"]
          enum: [nl, en, null]
    UpdateLocaleRequest:
      type: object
      required: [preferredLocale]
      properties:
        preferredLocale:
          type: ["string", "null"]
          enum: [nl, en, null]
    UpdateLocaleResponse:
      type: object
      required: [preferredLocale]
      properties:
        preferredLocale:
          type: ["string", "null"]
          enum: [nl, en, null]
    User:
      type: object
      required: [id, email, name, role, accountStatus, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
