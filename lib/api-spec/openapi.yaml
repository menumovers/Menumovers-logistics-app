    Settings:
      type: object
      required:
        [outboundWebhookUrl, outboundWebhookUrlSource, outboundWebhookEnabled, allowRiderSelfClaim, vapidConfigured]
      properties:
        outboundWebhookUrl:
          type: ["string", "null"]
        outboundWebhookUrlSource:
          type: string
          enum: [env, settings, unset]
        outboundWebhookEnabled:
          type: boolean
          description: |
            Master switch for outbound delivery. Off by default — the receiving
            end is not built yet. When off, no event is dispatched or queued and
            the retry loop does no work. An unset URL counts as disabled
            regardless of this flag.
        allowRiderSelfClaim:
          type: boolean
        pickupTravelOverrideMinutes:
          type: ["integer", "null"]
          description: |
            Minutes from leaving the restaurant to reaching the customer, used to
            derive the original pickup time. Null means use the per-order estimates
            from the inbound payload; a value overrides them outright.
        vapidConfigured:
          type: boolean
        inboundSecretConfigured:
          type: boolean
