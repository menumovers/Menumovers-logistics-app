        addition:
          type: ["string", "null"]
        postalCode:
          type: string
        city:
          type: string
        country:
          type: string
        latitude:
          type: ["string", "null"]
        longitude:
          type: ["string", "null"]
        deliveryInstructions:
          type: ["string", "null"]
        deliveryFee:
          type: string
        totalAmount:
          type: string
        tipRider:
          type: string
        tipRestaurant:
          type: string
        supTotal:
          type: string
        statiegeldTotal:
          type: string
        administrationCosts:
          type: string
        deliveryMethod:
          $ref: "#/components/schemas/DeliveryMethod"
        paymentMethod:
          type: string
        cashPayment:
          type: ["object", "null"]
          properties:
            type:
              type: ["string", "null"]
            changeAmount:
              type: ["string", "null"]
            changeRequired:
              type: ["string", "null"]
            label:
              type: ["string", "null"]
        kitchenNotes:
          type: ["string", "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        pickupTimeOriginal:
          type: string
          format: date-time
        pickupTimeRider:
          type: ["string", "null"]
          format: date-time
        pickupTimeRestaurant:
          type: ["string", "null"]
          format: date-time
        pickupTimeOverride:
          type: ["string", "null"]
          format: date-time
        sourceCreatedAt:
          type: string
          format: date-time
        requestedDeliveryTime:
          type: string
          format: date-time
          description: |
            The customer's checkout selection resolved to a timestamp, and the
            storefront's source of truth for fulfilment. For a scheduled order this
            is exactly the time they picked; for an ASAP order it is the storefront's
            calculated delivery estimate. The user-facing string the customer actually
            saw ("Zo snel mogelijk", "vandaag om 18:30") lives in the storefront's
            separate `deliveryTimeDisplay` field and is NOT sent here — so an ASAP
            time should be presented as an estimate, never as a promised time.
        deliveryTimeType:
          $ref: "#/components/schemas/DeliveryTimeType"
        sourceRestaurantReadyTime:
          type: ["string", "null"]
          format: date-time
        restaurantMinDeliveryTime:
          type: ["integer", "null"]
        restaurantMinPickupTime:
          type: ["integer", "null"]
        restaurantMinPrepTime:
          type: ["integer", "null"]
        deliveryTeamMinDeliveryTime:
          type: ["integer", "null"]
        deliveryTeamMinPickupTime:
          type: ["integer", "null"]
        deliveryTeamMinPrepTime:
          type: ["integer", "null"]
        effectivePickupTime:
          type: string
          format: date-time
        effectivePickupSource:
          $ref: "#/components/schemas/PickupTimeSource"
        pendingRiderNotification:
          type: ["string", "null"]
        failureReason:
          type: ["string", "null"]
        allowedTransitions:
          type: array
          items:
            $ref: "#/components/schemas/OrderStatus"
          description: |
            Statuses reportable from the order's current one, derived server-side from
            the state machine. Status is a report rather than a gate: skipping ahead
            and correcting a mis-tap are both accepted. `pending` and `driver_assigned`
            never appear — they are coupled to `riderId` and written by
            `POST /orders/{id}/assign`. Clients should render these rather than keep
            their own transition table.
        itemsAdjustment:
          type: ["string", "null"]
          description: |
            Value of the delivered items minus the value of the ordered items, when a
            coordinator has hidden or added anything. Null when untouched. `totalAmount`
            is written once at ingestion and never recomputed, so this is the amount by
            which the delivered list no longer matches what was charged — surfaced on the
            receipt rather than silently producing a breakdown that doesn't add up.
        restaurantAcceptedAt:
          type: ["string", "null"]
          format: date-time
          description: |
            When the restaurant acknowledged the order. Null means not yet acknowledged,
            which blocks nothing — it is a read receipt, not a gate.
        restaurantAcceptedByName:
          type: ["string", "null"]
        holdState:
          oneOf:
            - $ref: "#/components/schemas/OrderHoldState"
            - type: "null"
          description: |
            The hold family — the only mechanism that gates an order. Null means not
            held. A hold blocks new assignment only; an order already being worked
            keeps accepting status reports.
        holdReason:
          type: ["string", "null"]
        heldAt:
          type: ["string", "null"]
          format: date-time
        heldByUserName:
          type: ["string", "null"]
          description: Null for automatic holds (`parked`).
        tripId:
          type: ["string", "null"]
        tripNumber:
          type: ["integer", "null"]
          description: Human-friendly trip number for the trip this order belongs to.
        bundlePickupTime:
          type: ["string", "null"]
          format: date-time
          description: |
            Earliest effective pickup time across same-restaurant orders in
            the same trip. Null when the order is not part of a trip with
            another order at the same restaurant.
        createdAt:
          type: string
          format: date-time
