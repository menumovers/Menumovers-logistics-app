          type: string
        quantity:
          type: integer
        price:
          type: string
        notes:
          type: ["string", "null"]
        totalPrice:
          type: ["string", "null"]
          description: Line total as sent by the source, not computed here. Absent for items added later via the admin add-item flow.
        externalId:
          type: ["string", "null"]
          description: POS/kitchen article id, when the source provides one.
    InboundOrderPayload:
      type: object
      required:
        - orderId
        - customer
        - items
        - deliveryFee
        - totalAmount
        - tipRider
        - tipRestaurant
        - supTotal
        - statiegeldTotal
        - administrationCosts
        - deliveryMethod
        - paymentMethod
        - sourceCreatedAt
        - requestedDeliveryTime
        - deliveryTimeType
      properties:
        orderId:
          type: string
        restaurantNameCode:
          type: string
          description: |
            The restaurant's nameCode as defined in the restaurants table. If absent or
            unmatched, the order is filed against the placeholder restaurant and parked —
            see the endpoint description.
        customer:
          type: object
          required: [name, phone, address, street, postalCode, city, country]
          properties:
            name:
              type: string
            phone:
              type: string
            email:
              type: ["string", "null"]
            address:
              type: string
              description: Single-line display address. Structured components below are separate, not derived from this.
            street:
              type: string
            houseNumber:
              type: ["string", "null"]
            addition:
              type: ["string", "null"]
            postalCode:
              type: string
            city:
              type: string
            country:
              type: string
            latitude:
              type: ["string", "null"]
              description: Decimal degrees as a string, matching this app's numeric-as-string convention (see deliveryFee).
            longitude:
              type: ["string", "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        deliveryFee:
          type: string
        totalAmount:
          type: string
        tipRider:
          type: string
        tipRestaurant:
          type: string
        supTotal:
          type: string
        statiegeldTotal:
          type: string
        administrationCosts:
          type: string
        deliveryMethod:
          $ref: "#/components/schemas/DeliveryMethod"
        paymentMethod:
          type: string
        cashPayment:
          type: ["object", "null"]
          description: |
            Present when the order is NOT paid online — i.e. payment happens on
            delivery. Despite the name this is not always cash: `type` says which
            on-delivery method applies. Only `exact` and `custom` involve physical
            money, so change is meaningless for `tikkie` and `qr`. All fields are
            raw captures from the source.
          properties:
            type:
              type: ["string", "null"]
              description: |
                `exact` — physical cash, customer has it exactly.
                `custom` — physical cash, customer pays with more, change needed.
                `tikkie` — payment request, nothing physical changes hands.
                `qr` — scan to pay, nothing physical changes hands.
            changeAmount:
              type: ["string", "null"]
              description: |
                The amount the customer will pay WITH — not the change owed. The change
                a rider carries back is `changeAmount - totalAmount`. Only meaningful
                for the physical-cash types (`exact`, `custom`).
            changeRequired:
              type: ["string", "null"]
            label:
              type: ["string", "null"]
              description: Bestellenbij's own ready-made Dutch display string.
        kitchenNotes:
          type: ["string", "null"]
        deliveryInstructions:
          type: ["string", "null"]
        sourceCreatedAt:
          type: string
          format: date-time
        requestedDeliveryTime:
          type: string
          format: date-time
          description: |
            The customer's checkout selection resolved to a timestamp, and the
            storefront's source of truth for fulfilment. For a scheduled order this
            is exactly the time they picked; for an ASAP order it is the storefront's
            calculated delivery estimate. The user-facing string the customer actually
            saw ("Zo snel mogelijk", "vandaag om 18:30") lives in the storefront's
            separate `deliveryTimeDisplay` field and is NOT sent here — so an ASAP
            time should be presented as an estimate, never as a promised time.
        deliveryTimeType:
          $ref: "#/components/schemas/DeliveryTimeType"
        sourceRestaurantReadyTime:
          type: ["string", "null"]
          format: date-time
        restaurantMinDeliveryTime:
          type: ["integer", "null"]
        restaurantMinPickupTime:
          type: ["integer", "null"]
        restaurantMinPrepTime:
          type: ["integer", "null"]
        deliveryTeamMinDeliveryTime:
          type: ["integer", "null"]
        deliveryTeamMinPickupTime:
          type: ["integer", "null"]
        deliveryTeamMinPrepTime:
          type: ["integer", "null"]
    Order:
