        externalId:
          type: ["string", "null"]
          description: POS/kitchen article id, when the source provides one.
    OriginalOrderItemsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
    InboundOrderPayload:
      type: object
      required:
        - orderId
        - customer
        - items
        - deliveryFee
        - totalAmount
        - tipRider
        - tipRestaurant
        - supTotal
        - statiegeldTotal
        - administrationCosts
        - deliveryMethod
        - paymentMethod
        - sourceCreatedAt
        - requestedDeliveryTime
        - deliveryTimeType
      properties:
        orderId:
          type: string
        restaurantNameCode:
          type: string
          description: |
            The restaurant's nameCode as defined in the restaurants table. If absent or
            unmatched, the order is filed against the placeholder restaurant and parked —
            see the endpoint description.
        customer:
          type: object
          required: [name, phone, address, street, postalCode, city, country]
          properties:
            name:
              type: string
            phone:
              type: string
            email:
              type: ["string", "null"]
            address:
              type: string
              description: |
                The source's own single line, built from the same components it
                sends below (`buildFullAddress()` at the source). It is a
                *rendering* of them, not an independent record — it cannot carry
                anything they don't.

                A previous version of this description said the two were
                "separate, not derived from this". That was wrong, and it was
                wrong in the direction that invents work: it implied the line
                might hold detail the components lack.
            street:
              type: string
            houseNumber:
              type: ["string", "null"]
            addition:
              type: ["string", "null"]
            postalCode:
              type: string
            city:
              type: string
            country:
              type: string
            latitude:
              type: ["string", "null"]
              description: Decimal degrees as a string, matching this app's numeric-as-string convention (see deliveryFee).
            longitude:
              type: ["string", "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        deliveryFee:
          type: string
        totalAmount:
          type: string
        tipRider:
          type: string
        tipRestaurant:
          type: string
        supTotal:
          type: string
        statiegeldTotal:
          type: string
        administrationCosts:
          type: string
        deliveryMethod:
          $ref: "#/components/schemas/DeliveryMethod"
        paymentMethod:
          type: string
        cashPayment:
          type: ["object", "null"]
          description: |
            Present when the order is NOT paid online — i.e. payment happens on
            delivery. Despite the name this is not always cash: `type` says which
            on-delivery method applies. Only `exact` and `custom` involve physical
            money, so change is meaningless for `tikkie` and `qr`. All fields are
            raw captures from the source.
          properties:
            type:
              type: ["string", "null"]
              description: |
                `exact` — physical cash, customer has it exactly.
                `custom` — physical cash, customer pays with more, change needed.
                `tikkie` — payment request, nothing physical changes hands.
                `qr` — scan to pay, nothing physical changes hands.
            changeAmount:
              type: ["string", "null"]
              description: |
                The amount the customer will pay WITH — not the change owed. The change
                a rider carries back is `changeAmount - totalAmount`. Only meaningful
                for the physical-cash types (`exact`, `custom`).
            changeRequired:
              type: ["string", "null"]
            label:
              type: ["string", "null"]
              description: Bestellenbij's own ready-made Dutch display string.
        kitchenNotes:
          type: ["string", "null"]
        deliveryInstructions:
          type: ["string", "null"]
        sourceCreatedAt:
          type: string
          format: date-time
          description: |
            The order's creation timestamp at the source — when the customer
            completed checkout. This is the anchor every other duration below
            counts from.
        requestedDeliveryTime:
          type: string
          format: date-time
          description: |
            The customer's checkout selection resolved to a timestamp, and the
            storefront's source of truth for fulfilment. For a scheduled order this
            is exactly the time they picked; for an ASAP order it is the storefront's
            calculated delivery estimate. The user-facing string the customer actually
            saw ("Zo snel mogelijk", "vandaag om 18:30") lives in the storefront's
            separate `deliveryTimeDisplay` field and is NOT sent here — so an ASAP
            time should be presented as an estimate, never as a promised time.
        deliveryTimeType:
          $ref: "#/components/schemas/DeliveryTimeType"
        sourceRestaurantReadyTime:
          type: ["string", "null"]
          format: date-time
          description: |
            When the source calculated the restaurant should have the order
            ready, using that restaurant's settings as they stood at the moment
            of the order. **ASAP orders only** — absent for `later_today` and
            `other_day`.

            It is the source's answer to a question we can also answer
            ourselves from `sourceCreatedAt + minPickupTime`. Retained for audit
            and as a cross-check, not as a formula input.

        # The six duration fields below are integer MINUTES, all measured from
        # checkout (`sourceCreatedAt`) as it stood at the moment of ordering.
        # Each comes in a `restaurant*` and a `deliveryTeam*` variant: the
        # restaurant's own configured figure and the delivery team's.
        restaurantMinDeliveryTime:
          type: ["integer", "null"]
          description: |
            Checkout-to-doorstep, in minutes. What the source uses to calculate
            the delivery estimate it shows the customer. **This is the whole
            journey, prep included — it is not travel time.**
        restaurantMinPickupTime:
          type: ["integer", "null"]
          description: |
            Checkout-to-restaurant-pickup, in minutes, as at the moment of
            ordering. This is the one that maps to our pickup time.
        restaurantMinPrepTime:
          type: ["integer", "null"]
          description: |
            **Legacy at the source. Ignore it.** Stored because we store
            everything the source sends, but nothing should read it.
        deliveryTeamMinDeliveryTime:
          type: ["integer", "null"]
          description: Checkout-to-doorstep, in minutes, per the delivery team's settings.
        deliveryTeamMinPickupTime:
          type: ["integer", "null"]
          description: Checkout-to-restaurant-pickup, in minutes, per the delivery team's settings.
        deliveryTeamMinPrepTime:
          type: ["integer", "null"]
          description: "**Legacy at the source. Ignore it.**"
    Order:
      type: object
      required:
        - id
        - externalOrderId
        - restaurantId
        - status
        - customerName
        - customerPhone
        - deliveryAddress
        - deliveryAddressOriginal
        - street
        - postalCode
        - city
        - country
        - deliveryFee
        - totalAmount
        - tipRider
        - tipRestaurant
        - supTotal
        - statiegeldTotal
        - administrationCosts
        - deliveryMethod
        - paymentMethod
        - items
        - pickupTimeOriginal
        - sourceCreatedAt
        - requestedDeliveryTime
        - deliveryTimeType
        - effectivePickupTime
        - allowedTransitions
        - createdAt
      properties:
        id:
          type: string
        externalOrderId:
          type: string
        restaurantId:
          type: string
        riderId:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/OrderStatus"
        customerName:
          type: string
        customerPhone:
          type: string
        customerEmail:
          type: ["string", "null"]
        deliveryAddress:
          type: string
          description: |
            The order's current address as one line, built from the components
            below on every read and never stored. This is what screens render.
            Corrections show up here because the components are the only
            writable copy (D12).
        deliveryAddressOriginal:
          type: string
          description: |
            The single-line address exactly as the source sent it, immutable
            after ingestion — the same pattern as `pickupTimeOriginal`. Kept so
            a coordinator can see what actually arrived. Nothing operational
            reads it; use `deliveryAddress` for anything the app does.
        street:
          type: string
        houseNumber:
          type: ["string", "null"]
        addition:
          type: ["string", "null"]
        postalCode:
          type: string
        city:
          type: string
        country:
          type: string
        latitude:
          type: ["string", "null"]
        longitude:
          type: ["string", "null"]
        deliveryInstructions:
          type: ["string", "null"]
        deliveryFee:
          type: string
        totalAmount:
          type: string
        tipRider:
          type: string
        tipRestaurant:
          type: string
        supTotal:
          type: string
        statiegeldTotal:
          type: string
        administrationCosts:
          type: string
        deliveryMethod:
          $ref: "#/components/schemas/DeliveryMethod"
        paymentMethod:
          type: string
        cashPayment:
          type: ["object", "null"]
          properties:
            type:
              type: ["string", "null"]
            changeAmount:
              type: ["string", "null"]
            changeRequired:
              type: ["string", "null"]
            label:
              type: ["string", "null"]
        kitchenNotes:
          type: ["string", "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        pickupTimeOriginal:
          type: string
          format: date-time
        pickupTimeRider:
          type: ["string", "null"]
          format: date-time
        pickupTimeRestaurant:
          type: ["string", "null"]
          format: date-time
        pickupTimeOverride:
          type: ["string", "null"]
          format: date-time
        sourceCreatedAt:
          type: string
          format: date-time
        requestedDeliveryTime:
          type: string
          format: date-time
          description: |
            The customer's checkout selection resolved to a timestamp, and the
            storefront's source of truth for fulfilment. For a scheduled order this
            is exactly the time they picked; for an ASAP order it is the storefront's
            calculated delivery estimate. The user-facing string the customer actually
            saw ("Zo snel mogelijk", "vandaag om 18:30") lives in the storefront's
            separate `deliveryTimeDisplay` field and is NOT sent here — so an ASAP
            time should be presented as an estimate, never as a promised time.
        deliveryTimeType:
          $ref: "#/components/schemas/DeliveryTimeType"
        sourceRestaurantReadyTime:
          type: ["string", "null"]
          format: date-time
        restaurantMinDeliveryTime:
          type: ["integer", "null"]
        restaurantMinPickupTime:
          type: ["integer", "null"]
        restaurantMinPrepTime:
          type: ["integer", "null"]
        deliveryTeamMinDeliveryTime:
          type: ["integer", "null"]
        deliveryTeamMinPickupTime:
          type: ["integer", "null"]
        deliveryTeamMinPrepTime:
          type: ["integer", "null"]
        effectivePickupTime:
          type: string
          format: date-time
        effectivePickupSource:
          $ref: "#/components/schemas/PickupTimeSource"
        pendingRiderNotification:
          type: ["string", "null"]
        failureReason:
          type: ["string", "null"]
        allowedTransitions:
          type: array
          items:
            $ref: "#/components/schemas/OrderStatus"
          description: |
            Statuses reportable from the order's current one, derived server-side from
            the state machine. Status is a report rather than a gate: skipping ahead
            and correcting a mis-tap are both accepted. `pending` and `driver_assigned`
            never appear — they are coupled to `riderId` and written by
            `POST /orders/{id}/assign`. Clients should render these rather than keep
            their own transition table.
        itemsAdjustment:
          type: ["string", "null"]
          description: |
            Value of the delivered items minus the value of the ordered items, when a
            coordinator has hidden or added anything. Null when untouched. `totalAmount`
            is written once at ingestion and never recomputed, so this is the amount by
            which the delivered list no longer matches what was charged — surfaced on the
            receipt rather than silently producing a breakdown that doesn't add up.
        restaurantAcceptedAt:
          type: ["string", "null"]
          format: date-time
          description: |
            When the restaurant acknowledged the order. Null means not yet acknowledged,
            which blocks nothing — it is a read receipt, not a gate.
        restaurantAcceptedByName:
          type: ["string", "null"]
        holdState:
          oneOf:
            - $ref: "#/components/schemas/OrderHoldState"
            - type: "null"
          description: |
            The hold family — the only mechanism that gates an order. Null means not
            held. A hold blocks new assignment only; an order already being worked
            keeps accepting status reports.
        holdReason:
          type: ["string", "null"]
        heldAt:
          type: ["string", "null"]
          format: date-time
        heldByUserName:
          type: ["string", "null"]
          description: Null for automatic holds (`parked`).
        tripId:
          type: ["string", "null"]
        tripNumber:
          type: ["integer", "null"]
          description: Human-friendly trip number for the trip this order belongs to.
        bundlePickupTime:
          type: ["string", "null"]
          format: date-time
          description: |
            Earliest effective pickup time across same-restaurant orders in
            the same trip. Null when the order is not part of a trip with
            another order at the same restaurant.
        createdAt:
          type: string
          format: date-time
