    Settings:
      type: object
      required:
        [outboundWebhookUrl, outboundWebhookUrlSource, outboundWebhookEnabled, allowRiderSelfClaim, pickupEstimateDefaultMinutes, vapidConfigured]
      properties:
        outboundWebhookUrl:
          type: ["string", "null"]
        outboundWebhookUrlSource:
          type: string
          enum: [env, settings, unset]
        outboundWebhookEnabled:
          type: boolean
          description: |
            Master switch for outbound delivery. Off by default — the receiving
            end is not built yet. When off, no event is dispatched or queued and
            the retry loop does no work. An unset URL counts as disabled
            regardless of this flag.
        allowRiderSelfClaim:
          type: boolean
        pickupEstimateDefaultMinutes:
          type: integer
          description: |
            Our baseline estimate in minutes: how long before delivery a rider
            should collect. Used for every scheduled order, and as the last
            fallback for an ASAP order whose payload carried no minimum pickup
            time. Defaults to 20.
        pickupEstimateInTheMomentMinutes:
          type: ["integer", "null"]
          description: |
            Today's conditions, set by a coordinator in **absolute** terms —
            "we need 45 minutes today", not an adjustment to apply. **ASAP
            orders only:** how busy we are right now says nothing about an order
            scheduled for next week.

            Cleared automatically once a new operational day begins at 03:00
            Europe/Amsterdam. Null means no adjustment is in effect.
        pickupEstimateInTheMomentSetAt:
          type: ["string", "null"]
          format: date-time
          description: |
            When the in-the-moment value was last written. Read-only — set
            automatically alongside the value so the daily reset knows which
            operational day it belongs to.
        vapidConfigured:
          type: boolean
        inboundSecretConfigured:
          type: boolean
