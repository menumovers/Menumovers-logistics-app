<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E2A47" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Bestellenbij</title>
    <!-- Versioned URLs ensure browser-level icon caches cannot reuse the
         retired blue placeholder artwork. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/pwa-192x192-v2.png" />
    <!-- Default manifest is the rider PWA. main.tsx swaps in the restaurant
         manifest when the page loads under /restaurant so each side is
         independently installable. -->
    <link rel="manifest" id="app-manifest" href="/manifest-rider.webmanifest?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
